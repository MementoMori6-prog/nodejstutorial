<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Estrattore Buste Paga PDF</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f7f7f7; color: #222; }
    .card { max-width: 700px; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 16px; padding: 10px 14px; border: none; border-radius: 8px; background: #0d6efd; color: #fff; cursor: pointer; }
    button:disabled { background: #7aaef7; cursor: not-allowed; }
    .status { margin-top: 16px; white-space: pre-line; }
    .ok { color: #0a7d2d; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Estrattore Buste Paga (GUI)</h1>
    <p>Inserisci il percorso di un <strong>PDF</strong> o di una cartella con PDF e il percorso del file Excel in uscita.</p>

    <label for="inputPath">Percorso input (file PDF o cartella)</label>
    <input id="inputPath" placeholder="es. /percorso/input oppure /percorso/busta.pdf" />

    <label for="outputPath">Percorso output (.xls)</label>
    <input id="outputPath" value="./output/buste_paga.xls" />

    <button id="runBtn">Estrai e genera Excel</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const runBtn = document.getElementById('runBtn');
    const statusEl = document.getElementById('status');

    runBtn.addEventListener('click', async () => {
      const inputPath = document.getElementById('inputPath').value.trim();
      const outputPath = document.getElementById('outputPath').value.trim();

      statusEl.className = 'status';
      statusEl.textContent = 'Elaborazione in corso...';
      runBtn.disabled = true;

      try {
        const res = await fetch('/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ inputPath, outputPath })
        });

        const payload = await res.json();
        if (!res.ok) {
          throw new Error(payload.error || 'Errore sconosciuto');
        }

        statusEl.className = 'status ok';
        statusEl.textContent = `✅ ${payload.message}\nPDF elaborati: ${payload.processedFiles}\nFile creato: ${payload.outputPath}`;
      } catch (err) {
        statusEl.className = 'status err';
        statusEl.textContent = `❌ ${err.message}`;
      } finally {
        runBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
